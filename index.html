<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Slice Factory — Precision Cutting Lab</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    #stage { position: relative; overflow: hidden; background: #050609; --accent: #ff8a3c; --ink: #e9ecf2; --dim: rgba(233,236,242,.55);
      font-family: "Bahnschrift", "DIN Alternate", "SF Mono", Menlo, Consolas, ui-monospace, monospace; color: var(--ink); }
    #c { display: block; width: 100%; height: 100%; }
    #vignette { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%); }
    #hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; font-variant-numeric: tabular-nums; }
    .panel { position: absolute; left: 5%; right: 5%; box-sizing: border-box; background: rgba(8,9,13,.58);
      border: 1px solid rgba(255,255,255,.13); border-radius: calc(var(--h) * .006); }
    #top { top: calc(var(--h) * .025); padding: calc(var(--h) * .014) calc(var(--h) * .018) calc(var(--h) * .012); height: calc(var(--h) * .235); }
    #bottom { bottom: calc(var(--h) * .03); display: flex; padding: calc(var(--h) * .012) calc(var(--h) * .018); gap: 4%; }
    .lbl { display: block; font-size: calc(var(--h) * .0165); letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
    #segs { display: flex; gap: 1.6%; }
    .seg { flex: 1; }
    .seg .bar { height: calc(var(--h) * .0065); background: rgba(255,255,255,.14); overflow: hidden; }
    .seg i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
    .seg span { display: block; margin-top: calc(var(--h) * .006); font-size: calc(var(--h) * .0165); letter-spacing: .08em; color: var(--dim); }
    .seg span.on { color: var(--ink); }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: calc(var(--h) * .012); }
    .badge { font-size: calc(var(--h) * .0205); letter-spacing: .16em; padding: calc(var(--h) * .005) calc(var(--h) * .012);
      border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; }
    .tag { font-size: calc(var(--h) * .0185); letter-spacing: .18em; color: var(--dim); }
    .cuts { margin-top: calc(var(--h) * .012); display: flex; align-items: baseline; gap: calc(var(--h) * .012); flex-wrap: wrap; }
    .cuts .lbl { width: 100%; }
    .big { font-size: calc(var(--h) * .098); line-height: .95; font-weight: 300; letter-spacing: -.02em; }
    .of { font-size: calc(var(--h) * .024); color: var(--dim); letter-spacing: .1em; }
    .cell { flex: 1; }
    .val { display: block; margin-top: calc(var(--h) * .006); font-size: calc(var(--h) * .046); font-weight: 300; letter-spacing: -.01em; }
    #title { position: absolute; left: 6%; right: 6%; top: 36%; text-align: center; opacity: 0; }
    #t-main { font-size: calc(var(--h) * .05); font-weight: 600; letter-spacing: .06em; line-height: 1.12; text-shadow: 0 0 calc(var(--h) * .02) rgba(0,0,0,.85); }
    #t-sub { margin-top: calc(var(--h) * .012); font-size: calc(var(--h) * .0175); letter-spacing: .4em; color: var(--accent); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="hud">
      <div id="top" class="panel">
        <div id="segs"></div>
        <div class="row"><span id="tool" class="badge">TOOL: -</span><span id="round" class="tag">R1/5</span></div>
        <div class="cuts"><span class="lbl">CUTS</span><span class="big" id="v-cuts">0</span><span class="of" id="v-of"></span></div>
      </div>
      <div id="bottom" class="panel">
        <div class="cell"><span class="lbl">PIECES</span><span class="val" id="v-pieces">1</span></div>
        <div class="cell"><span class="lbl">PARTICLE SIZE</span><span class="val" id="v-size">4.2 cm</span></div>
      </div>
    </div>
    <div id="title"><div id="t-main"></div><div id="t-sub"></div></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
